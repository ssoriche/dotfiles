when:
  - event: pull_request
    path: &config_paths
      - 'renovate.json'
      - '.woodpecker/renovate-validate.yaml'
  - event: push
    branch: main
    path: *config_paths

steps:
  # Kept on the same tag as the CronJob in devops-blocks
  # (kubernetes/cicd/renovate/manifests/base/kustomization.yaml). A validator
  # newer than the bot accepts config the bot then rejects, which is exactly how
  # dotfiles#8 happened: managerFilePatterns was valid to the docs and schema
  # while the deployed bot was still on v39.
  - name: validate
    image: ghcr.io/renovatebot/renovate:44.7.2
    commands:
      # No file argument => validates renovate.json as repo config.
      # --strict fails on warnings, errors, or if a config migration is needed,
      # so a deprecated option is caught here rather than by the bot at 02:00.
      - renovate-config-validator --strict

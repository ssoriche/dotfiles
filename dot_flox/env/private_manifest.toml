# Flox global environment — the machine's package manager
#
# Package groups isolate nixpkgs revisions so fast-moving or
# ABI-coupled packages can upgrade independently.  Packages without
# an explicit pkg-group share the implicit "toplevel" group.

schema-version = "1.11.0"

[install]
# Search / Navigation
# ripgrep/fd are Renovate-managed (see renovate.json) and each has its own
# pkg-group. Two exact pins *can* share a group, but only while a single
# catalog snapshot satisfies both: ripgrep 15.2.0 + fd 10.4.2 locks fine,
# ripgrep 15.2.0 + fd 8.7.0 fails "constraints too tight". Renovate bumps
# packages on independent schedules, so co-pinned versions drift apart
# eventually. Hence the rule for this file: at most one Renovate-managed pin
# per pkg-group, with unpinned packages free to share it as followers —
# they carry no constraint and resolve from whatever snapshot the pin picks.
# See the editors and golang groups for that driver/follower pattern.
ripgrep.pkg-path = "ripgrep"
ripgrep.pkg-group = "ripgrep"
ripgrep.version = "15.2.0"
fd.pkg-path = "fd"
fd.pkg-group = "fd"
fd.version = "10.4.2"
fzf.pkg-path = "fzf"
fzf.version = ">=0.65.1"
eza.pkg-path = "eza"
eza.version = ">=0.23.0"
tree.pkg-path = "tree"
zoxide.pkg-path = "zoxide"
zoxide.version = ">=0.9.8"
yazi.pkg-path = "yazi"
yazi.version = ">=25.5.31"

# Text / JSON processing
bat.pkg-path = "bat"
jq.pkg-path = "jq"
jq.version = ">=1.8.1"
jq.outputs = "all"
jless.pkg-path = "jless"
jnv.pkg-path = "jnv"
jnv.version = ">=0.6.1"
fastgron.pkg-path = "fastgron"
fx.pkg-path = "fx"
fx.version = ">=38.0.0"
sd.pkg-path = "sd"
glow.pkg-path = "glow"

# Shells / Shell enhancements
# atuin is Renovate-managed (see renovate.json); its own pkg-group keeps the
# exact pin from constraining anything else.
atuin.pkg-path = "atuin"
atuin.pkg-group = "atuin.sh"
atuin.version = "18.18.1"
direnv.pkg-path = "direnv"
direnv.version = ">=2.37.1"

# Kubernetes. kubie is Renovate-managed (see renovate.json); the rest stay
# unpinned in the same group, same "editors" rationale as above.
kustomize = { pkg-path = "kustomize", pkg-group = "kubernetes" }
krew = { pkg-path = "krew", pkg-group = "kubernetes" }
kns = { pkg-path = "kns", pkg-group = "kubernetes" }
k9s = { pkg-path = "k9s", pkg-group = "kubernetes" }
kubie.pkg-path = "kubie"
kubie.pkg-group = "kubernetes"
kubie.version = "0.26.1"

# Networking / Security
nmap.pkg-path = "nmap"
nmap.version = ">=7.97"
age.pkg-path = "age"
passage.pkg-path = "passage"
step-cli.pkg-path = "step-cli"
wget.pkg-path = "wget"
_1password-cli.pkg-path = "_1password-cli"
_1password-cli.version = ">=2.31.1"

# System monitoring / Utilities
btop.pkg-path = "btop"
btop.version = ">=1.4.4"
pv.pkg-path = "pv"
pv.version = ">=1.9.34"
ncdu.pkg-path = "ncdu"
ncdu.version = ">=2.8.2"
spacer.pkg-path = "spacer"
spacer.version = ">=0.4.5"
moreutils.pkg-path = "moreutils"
tldr.pkg-path = "tldr"
tldr.outputs = "all"
chezmoi.pkg-path = "chezmoi"
chezmoi.version = ">=2.63.1"
q.pkg-path = "q"
q.version = ">=0.19.5"
dyff.pkg-path = "dyff"

# Recording
asciinema.pkg-path = "asciinema"
asciinema.outputs = "all"
asciinema-agg.pkg-path = "asciinema-agg"

# Virtualization
lima.pkg-path = "lima"
lima.version = ">=1.2.0"

# Backup
restic.pkg-path = "restic"

# macOS SDK frameworks (needed by some builds)
CoreServices.pkg-path = "darwin.apple_sdk.frameworks.CoreServices"
CoreServices.systems = ["aarch64-darwin"]

# --- Grouped packages (inline tables) ---

# vcs — ecosystem tools share a revision
git = { pkg-path = "git", pkg-group = "vcs" , outputs = "all" }
gh = { pkg-path = "gh", pkg-group = "vcs" }
tig = { pkg-path = "tig", pkg-group = "vcs" , outputs = "all" }
delta = { pkg-path = "delta", pkg-group = "vcs" }
difftastic = { pkg-path = "difftastic", pkg-group = "vcs" }
git-absorb = { pkg-path = "git-absorb", pkg-group = "vcs" }
git-credential-manager = { pkg-path = "git-credential-manager", pkg-group = "vcs" }
gitu = { pkg-path = "gitu", pkg-group = "vcs" }
gh-dash = { pkg-path = "gh-dash", pkg-group = "vcs" }

# editors — neovim + language server ABI compatibility. neovim is
# Renovate-managed (see renovate.json); lua-language-server/tree-sitter stay
# unpinned in the same group so they keep resolving from whatever snapshot
# satisfies neovim's pin.
neovim.pkg-path = "neovim"
neovim.pkg-group = "editors"
neovim.version = "0.12.4"
lua-language-server = { pkg-path = "lua-language-server", pkg-group = "editors" }
tree-sitter = { pkg-path = "tree-sitter", pkg-group = "editors" }

# golang — linter must match Go version, so the group is driven by go's pin and
# golangci-lint follows whatever snapshot satisfies it. go is Renovate-managed
# (see renovate.json); the "1.26" minor track is now an exact pin, set to the
# 1.26.5 the lock already resolved so this stays behaviour-neutral.
go.pkg-path = "go"
go.pkg-group = "golang"
go.version = "1.26.5"
golangci-lint = { pkg-path = "golangci-lint", pkg-group = "golang" }

# node — JS runtimes
nodejs = { pkg-path = "nodejs", pkg-group = "node" }
bun = { pkg-path = "bun", pkg-group = "node" }

# lua.org — Lua ecosystem
luarocks = { pkg-path = "luarocks", pkg-group = "lua.org" }
lua = { pkg-path = "lua51Packages.lua", pkg-group = "lua.org" , outputs = "all" }

# python — standalone, frequent updates. Renovate-managed (see renovate.json).
uv.pkg-path = "uv"
uv.pkg-group = "python"
uv.version = "0.12.0"

# linters — standalone analysis tools
typos = { pkg-path = "typos", pkg-group = "linters" }
dotenv-linter = { pkg-path = "dotenv-linter", pkg-group = "linters" }

# cloud — large package, independent update cadence
awscli2 = { pkg-path = "awscli2", pkg-group = "cloud" , outputs = "all" }

# pinned — version-locked packages
granted = { pkg-path = "granted", version = "0.36.3", pkg-group = "pinned" }

# claude — fast-moving, unfree; nixpkgs currently tracks upstream ahead of the flox
# catalog. Renovate-managed (see renovate.json).
claude-code.pkg-path = "claude-code"
claude-code.pkg-group = "claude"
claude-code.version = "2.1.220"

# pi-coding-agent — fast-moving AI tooling. Renovate-managed (see renovate.json).
pi-coding-agent.pkg-path = "pi-coding-agent"
pi-coding-agent.pkg-group = "pi-coding-agent"
pi-coding-agent.version = "0.82.1"

# nono — AI agent sandbox
nono = { pkg-path = "nono", pkg-group = "nono" }

# herdr — fast-moving AI tooling; nixpkgs currently tracks upstream ahead of the
# flox catalog. Renovate-managed (see renovate.json).
herdr.pkg-path = "herdr"
herdr.pkg-group = "herdr"
herdr.version = "0.7.4"

# container — Apple's Linux container runtime; isolate so it resolves to latest
container = { pkg-path = "container", pkg-group = "container", systems = ["aarch64-darwin"] }

# gui — was a single "gui" group; now one group per app. Nothing here is ABI
# coupled, so there is no reason to co-resolve them, and one pin per group is
# required for independent Renovate bumps (see the header comment). Separate
# groups still keep GUI apps from blocking CLI tool upgrades. All pinned to the
# version already locked, so the split is behaviour-neutral.
#
# aerospace/maccy are aarch64-darwin only, so Renovate resolves them through the
# flox-catalog-darwin datasource; requiring all three env systems would offer
# them nothing. Each also needs non-default versioning, see renovate.json:
# aerospace ships only -Beta prereleases, halloy uses YYYY.M[.P], and wezterm
# has a legacy YYYYMMDD-HHMMSS-hash format that sorts above its current
# YYYY-MM-DD one.
aerospace.pkg-path = "aerospace"
aerospace.pkg-group = "aerospace"
aerospace.systems = ["aarch64-darwin"]
aerospace.version = "0.21.3-Beta"
wezterm.pkg-path = "wezterm"
wezterm.pkg-group = "wezterm"
wezterm.version = "2026-07-16"
obsidian.pkg-path = "obsidian"
obsidian.pkg-group = "obsidian"
obsidian.version = "1.12.7"
halloy.pkg-path = "halloy"
halloy.pkg-group = "halloy"
halloy.version = "2026.7.2"
maccy.pkg-path = "maccy"
maccy.pkg-group = "maccy"
maccy.systems = ["aarch64-darwin"]
maccy.version = "2.6.1"

# Flake-based packages (pinned to specific commits/repos)
coderabbit-cli.pkg-path = "flox/coderabbit-cli"
coderabbit-cli.pkg-group = "coderabbit-cli"
agent-safehouse.flake = "github:NixOS/nixpkgs/b0ec52b771f1207053090f4ea9cf73a6040f0489#agent-safehouse"
agent-safehouse.systems = ["aarch64-darwin"]
# zap now cuts tagged releases, so follow the release tag instead of the default
# branch. Renovate-managed (see renovate.json) via the github-releases datasource.
zap.flake = "github:natejsimonsen/zap/v0.1.0"
zap.systems = ["aarch64-darwin"]


[hook]
on-activate = """
  export PATH="$HOME/.local/bin:$PATH"
"""

[profile]
bash = """
  setup-tools() {
    uv tool install --force --python python3.14 llm@latest
    uv tool install --force --python python3.14 aider@latest
    uv tool install --force --python python3.14 claude-code-transcripts
  }
  update-tools() {
    uv tool upgrade --all
  }
"""
fish = """
  function setup-tools
    uv tool install --force --python python3.14 llm@latest
    uv tool install --force --python python3.14 aider@latest
    uv tool install --force --python python3.14 claude-code-transcripts
  end
  function update-tools
    uv tool upgrade --all
  end
"""

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]

[options.allow]
unfree = true

[options.activate]
mode = "run"
